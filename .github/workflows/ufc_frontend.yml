name: UFC Frontend

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python docs/win/mma/ufc/scripts/frontend.py
      - name: Commit frontend CSVs
        run: |
          git add -- frontend/data/ufc/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update UFC frontend CSVs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
